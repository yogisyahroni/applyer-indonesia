name: Bootstrap upstream Applyer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.head_commit.message == 'chore: bootstrap upstream via GitHub Actions'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream Applyer
        run: git clone --depth 1 https://github.com/xCirno1/applyer.git "$RUNNER_TEMP/applyer-upstream"

      - name: Import upstream working tree
        run: |
          rsync -a --delete \
            --exclude '.git' \
            --exclude '.github/workflows/bootstrap-upstream.yml' \
            "$RUNNER_TEMP/applyer-upstream/" ./

      - name: Commit imported baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi
          git commit -m "chore: import xCirno1/applyer upstream baseline"
          git push origin HEAD:main
