name: Bootstrap upstream Applyer

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream Applyer
        run: git clone --depth 1 https://github.com/xCirno1/applyer.git "$RUNNER_TEMP/applyer-upstream"

      - name: Import upstream working tree
        shell: bash
        run: |
          rsync -a --delete --exclude '.git' "$RUNNER_TEMP/applyer-upstream/" ./
          rm -f .github/workflows/bootstrap-upstream.yml

      - name: Commit imported baseline
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import xCirno1/applyer upstream baseline"
          git push origin HEAD:main
