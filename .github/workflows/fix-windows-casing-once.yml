name: Fix Windows import path once

on:
  push:
    branches:
      - feat/indonesia-mvp

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update DataGrid imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in [
              'src/renderer/src/components/companyBoards/CompanyBoardsPanel.tsx',
              'src/renderer/src/components/companyBoards/boardColumns.tsx',
          ]:
              path = Path(file)
              text = path.read_text(encoding='utf-8')
              text = text.replace("'../ui/DataTable'", "'../ui/DataGrid'")
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet; then
            echo "Imports already fixed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/components/companyBoards/CompanyBoardsPanel.tsx src/renderer/src/components/companyBoards/boardColumns.tsx
          git commit -m "fix: use unambiguous DataGrid module on Windows"
          git push origin HEAD:feat/indonesia-mvp
