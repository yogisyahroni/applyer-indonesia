name: Windows Build

on:
  push:
    branches: ['codex/**']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver release version, e.g. 0.1.1'
        required: true
        type: string

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release version
        shell: bash
        env:
          TAG_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
        run: |
          VERSION="${TAG_VERSION#v}"
          if [ -z "$VERSION" ]; then VERSION="$INPUT_VERSION"; fi
          if [ -z "$VERSION" ]; then VERSION=$(node -p "require('./package.json').version"); fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION"
            exit 1
          fi
          npm version "$VERSION" --no-git-tag-version
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and rebuild native Electron modules
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Several Vitest workers can import Electron at the same time on a fresh
      # Windows runner. Electron then lazily extracts the same DLLs concurrently,
      # which intermittently fails with ERROR_FILE_EXISTS (for example
      # dxcompiler.dll). Serializing only the Windows CI suite removes that
      # installer race without skipping any tests or changing application code.
      - name: Test on Windows
        run: npm run test -- --maxWorkers=1

      - name: Build Windows NSIS installer
        run: npm run package -- --win nsis --x64 --publish never

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: applyer-indonesia-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Applyer Indonesia v${{ env.RELEASE_VERSION }}
          body: |
            Release for Applyer Indonesia
            Version ${{ env.RELEASE_VERSION }} built on ${{ github.run_date }}

            This release contains the Windows NSIS installer for Applyer Indonesia.
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          draft: false
          prerelease: false
