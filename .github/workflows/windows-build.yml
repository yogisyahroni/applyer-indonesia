name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 / NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies and rebuild native Electron modules
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Several Vitest workers can import Electron at the same time on a fresh
      # Windows runner. Electron then lazily extracts the same DLLs concurrently,
      # which intermittently fails with ERROR_FILE_EXISTS (for example
      # dxcompiler.dll). Serializing only the Windows CI suite removes that
      # installer race without skipping any tests or changing application code.
      - name: Test on Windows
        run: npm run test -- --maxWorkers=1

      - name: Build Windows NSIS installer
        run: npm run package -- --win nsis --x64 --publish onTag

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: applyer-indonesia-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Applyer Indonesia v${{ github.run_number }}
          body: |
            Release for Applyer Indonesia
            Built on ${{ github.run_date }}

            This release contains the Windows NSIS installer for Applyer Indonesia.
          files: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
          draft: false
          prerelease: false