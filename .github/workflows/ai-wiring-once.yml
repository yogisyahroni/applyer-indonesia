name: AI Wiring Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-wiring-once.yml'
      - 'scripts/patch-ai-wiring.mjs'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch preload and locales
        run: node scripts/patch-ai-wiring.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/preload/index.ts src/renderer/src/i18n/locales/en/settings.json src/renderer/src/i18n/locales/id/settings.json src/renderer/src/i18n/locales/en/workspace.json src/renderer/src/i18n/locales/id/workspace.json
          git commit -m "feat: wire AI gateway into renderer and preload"
          git push
