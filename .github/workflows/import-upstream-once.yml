name: Import upstream once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import xCirno1/applyer
        shell: bash
        run: |
          git clone --depth 1 https://github.com/xCirno1/applyer.git "$RUNNER_TEMP/upstream"
          rsync -a --delete --exclude '.git' "$RUNNER_TEMP/upstream/" ./
          rm -f .github/workflows/import-upstream-once.yml
          rm -f .github/workflows/bootstrap-upstream.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import xCirno1/applyer upstream baseline"
          git push origin HEAD:main
